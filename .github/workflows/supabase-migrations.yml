# Migrations Supabase — EN DIRECT, et pas par le réutilisable de la famille.
#
# C'EST UNE DÉVIATION ASSUMÉE, ET VOICI SA RAISON. Le réutilisable
# `pwa-supabase-migrate.yml` commence par `supabase link`, qui passe par l'API de
# GESTION de Supabase. Sur ce projet elle répond :
#
#   Authorization failed for the access token and project ref pair:
#   Your account does not have the necessary privileges to access this endpoint
#
# Ce n'est pas un jeton expiré, c'est un jeton qui ne couvre pas ce projet : il
# appartient à un AUTRE compte Supabase. Les migrations échouaient donc depuis
# juin, et `db push` n'a jamais tourné une seule fois ici — d'où `keep_alive`
# absente pendant des mois et un keep-alive rouge, c'est-à-dire AUCUNE
# protection contre la mise en pause.
#
# Or migrer ne demande pas l'API de gestion : il faut Postgres, et le dépôt a
# déjà `SUPABASE_DB_PASSWORD`. On se connecte donc directement, sans `link`.
#
# TROIS CHOSES ONT ÉTÉ NÉCESSAIRES POUR TROUVER L'ADRESSE, aucune n'est
# devinable — les noter évite de refaire la recherche :
#
#  1. La connexion DIRECTE est hors de portée. `db.<ref>.supabase.co` n'a plus
#     d'enregistrement A, seulement AAAA, et les runners GitHub n'ont pas
#     d'IPv6 sortante. Il faut le pooler, qui est en IPv4.
#  2. L'hôte du pooler contient la RÉGION, que l'API de gestion aurait donnée si
#     elle n'était pas refusée. Elle se déduit de l'IPv6 du projet
#     (2a05:d012:… ) confrontée à `ip-ranges.json` d'AWS : préfixe 2a05:d012::/36
#     → eu-west-3.
#  3. Supabase expose DEUX pools par région, `aws-0-` et `aws-1-` (et pas de
#     `aws-2-`). Ce projet est sur le SECOND : `aws-0-` accepte la connexion
#     puis répond « tenant/user not found », ce qui ressemble à une panne mais
#     signifie « pas ici ».
#
# RETIRER CETTE DÉVIATION quand le secret `SUPABASE_ACCESS_TOKEN` portera un
# jeton émis par le compte propriétaire du projet : ce fichier redevient alors
# l'appel de six lignes au réutilisable, comme dans les cinq autres dépôts.
name: Supabase migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

permissions:
  contents: read

# Porté ici parce qu'on n'appelle plus le réutilisable, qui le portait :
# jamais deux pushs concurrents sur la base, et on ne coupe pas un run en vol —
# une migration interrompue à mi-chemin laisse un état que personne n'a décrit.
concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrer:
    # Même garde que les autres dépôts : la variable qui active le backend
    # active la migration. Un dépôt sans projet ne doit pas rougir à chaque
    # poussée.
    if: vars.VITE_SUPABASE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest

      - name: Appliquer les migrations en attente
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD manquant — Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Le mot de passe part dans une URL : il doit être encodé, sinon un
          # `@` ou un `/` coupe la chaîne de connexion en deux.
          encoded="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')"
          # L'encodage change la chaîne, donc le masque automatique de GitHub ne
          # la reconnaît plus. On le repose à la main : sans ça, une erreur du
          # CLI qui recracherait l'URL publierait le mot de passe en clair.
          echo "::add-mask::$encoded"

          url="postgresql://postgres.${PROJECT_ID}:${encoded}@aws-1-eu-west-3.pooler.supabase.com:5432/postgres"
          export PGCONNECT_TIMEOUT=10

          # GARDE-FOU. `db push` ne joue que ce que le suivi ne porte pas
          # encore. Si ce suivi était vide ou absent, il rejouerait TOUT le
          # schéma sur des objets déjà en place. Ici le schéma a été posé
          # autrement que par `db push` — on vérifie donc avant de pousser.
          suivi="$(psql "$url" -tAc "select count(*) from supabase_migrations.schema_migrations" 2>&1 || echo "0")"
          echo "Migrations déjà suivies en base : $suivi"
          case "$suivi" in
            ''|*[!0-9]*|0)
              echo "::error::Suivi des migrations absent ou vide — db push rejouerait tout le schéma. Arrêt."
              exit 1
              ;;
          esac

          supabase db push --db-url "$url"

      - name: Vérifier que le keep-alive est servi
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # PostgREST recharge son cache de schéma de façon ASYNCHRONE : juste
          # après un DDL il sert encore des 404 pendant une trentaine de
          # secondes. On laisse passer, sinon on conclurait à tort à un échec.
          sleep 35
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${ANON_KEY}")"
          echo "GET /rest/v1/keep_alive → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::La table keep_alive n'est pas servie (HTTP $code) — le ping anti-pause resterait rouge."
            exit 1
          fi
