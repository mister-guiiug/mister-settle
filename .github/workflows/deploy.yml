# Déploiement GitHub Pages, délégué au réutilisable de la famille.
#
# PAS DE `concurrency` ICI : le réutilisable déclare déjà le sien (`group:
# pages`). Redoublé dans l'appelant, GitHub refuse le fichier AVANT de créer un
# seul job, sans autre message que « workflow file issue ».
#
# LES VARIABLES DE LA BASE PARTAGÉE passent par `build-env`, lues dans `vars`
# — jamais dans `secrets`, que Vite copie de toute façon dans le bundle. Pas
# de `required-env` : sans elles, l'application démarre quand même, sur
# l'appareil (ADR 0004) — c'est une propriété qu'elle doit garder.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  deploy:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-deploy.yml@v4
    with:
      use-base-path: true
      build-env: |
        VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
